name: Android CI — Build & Test

on:
  push:
    branches: [ "feature/**", "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  build:
    name: Build & Test
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Validate Gradle wrapper
        uses: gradle/wrapper-validation-action@v3

      # Decode the stable debug keystore so every CI build is signed with
      # the same certificate. This allows over-the-air upgrades without
      # uninstalling the previously installed debug APK.
      #
      # Security: the secret is mapped to an env var before the shell sees it.
      # The shell never receives it as an interpolated string literal.
      # The build FAILS HARD if the secret is absent — no silent fallback to
      # an ephemeral random key.
      - name: Decode stable debug keystore
        env:
          KEYSTORE_B64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
          STORE_PASS: ${{ secrets.DEBUG_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.DEBUG_KEY_ALIAS }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "::error::DEBUG_KEYSTORE_BASE64 secret is not set. \
          Stable signing is mandatory — a silent fallback to an ephemeral key \
          would break OTA upgrades. Add the secret to this repository before \
          triggering another build."
            exit 1
          fi

          # Decode without interpolating the secret into shell source.
          printf '%s' "$KEYSTORE_B64" | base64 --decode > ci-debug.keystore

          # Verify the decoded keystore carries the expected stable certificate.
          EXPECTED="3600e8ff78aad20c39a91f50a619cf4b5b1d77265d15328ec1c317be91ebabea"
          ACTUAL=$(keytool -list -v \
            -keystore ci-debug.keystore \
            -storepass "${STORE_PASS:-android}" \
            -alias "${KEY_ALIAS:-androiddebugkey}" \
            -noprompt 2>&1 \
            | grep -i "sha256" \
            | awk '{print $NF}' \
            | tr -d ':' \
            | tr '[:upper:]' '[:lower:]' \
            | head -1)

          if [ -z "$ACTUAL" ]; then
            echo "::error::Could not read a certificate fingerprint from the decoded keystore. \
          Check that DEBUG_KEYSTORE_BASE64 is the correct Base64-encoded keystore."
            exit 1
          fi

          if [ "$ACTUAL" != "$EXPECTED" ]; then
            echo "::error::Keystore SHA-256 mismatch."
            echo "::error::  Got:      $ACTUAL"
            echo "::error::  Expected: $EXPECTED"
            echo "::error::The keystore in DEBUG_KEYSTORE_BASE64 is not the approved stable key."
            exit 1
          fi

          echo "✅ Keystore SHA-256 verified: $ACTUAL"

      - name: Run unit tests
        run: ./gradlew testDebugUnitTest --no-daemon

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: app/build/reports/tests/
          retention-days: 7

      - name: Build debug APK
        run: ./gradlew assembleDebug --no-daemon
        env:
          DEBUG_STORE_PASSWORD: ${{ secrets.DEBUG_STORE_PASSWORD }}
          DEBUG_KEY_ALIAS: ${{ secrets.DEBUG_KEY_ALIAS }}
          DEBUG_KEY_PASSWORD: ${{ secrets.DEBUG_KEY_PASSWORD }}

      # Confirm the APK was signed with the stable keystore, not an ephemeral one.
      # Uses apksigner (from the build-tools Gradle downloaded) when available;
      # falls back to keytool -printcert -jarfile (v1 / JAR signature).
      - name: Verify APK signing certificate
        run: |
          APK="app/build/outputs/apk/debug/app-debug.apk"
          EXPECTED="3600e8ff78aad20c39a91f50a619cf4b5b1d77265d15328ec1c317be91ebabea"

          # Prefer apksigner — it reads v2/v3 APK Signature Scheme blocks.
          APKSIGNER=$(find "${ANDROID_HOME}" -name "apksigner" -type f 2>/dev/null \
            | sort -V | tail -1)

          if [ -n "$APKSIGNER" ]; then
            echo "Using apksigner: $APKSIGNER"
            ACTUAL=$("$APKSIGNER" verify --print-certs "$APK" 2>&1 \
              | grep -i "sha-256" \
              | awk '{print $NF}' \
              | tr -d ':' \
              | tr '[:upper:]' '[:lower:]' \
              | head -1)
          else
            echo "apksigner not found; falling back to keytool -printcert -jarfile"
            ACTUAL=$(keytool -printcert -jarfile "$APK" 2>&1 \
              | grep -i "sha256" \
              | awk '{print $NF}' \
              | tr -d ':' \
              | tr '[:upper:]' '[:lower:]' \
              | head -1)
          fi

          if [ -z "$ACTUAL" ]; then
            echo "::error::Could not read certificate fingerprint from $APK"
            exit 1
          fi

          echo "APK certificate SHA-256: $ACTUAL"

          if [ "$ACTUAL" != "$EXPECTED" ]; then
            echo "::error::APK certificate mismatch."
            echo "::error::  Got:      $ACTUAL"
            echo "::error::  Expected: $EXPECTED"
            echo "::error::The APK was not signed with the stable debug keystore."
            exit 1
          fi

          echo "✅ APK signed with stable keystore: $ACTUAL"

      # Confirm the official Erthi gold-seal emblem is embedded in the APK.
      # Fails if the fabricated mosque icon or any placeholder was packaged instead.
      - name: Verify official Erthi launcher icon in APK
        run: |
          APK="app/build/outputs/apk/debug/app-debug.apk"
          if unzip -l "$APK" | grep -q "ic_erthi_seal"; then
            echo "✅ Official Erthi seal icon found in APK:"
            unzip -l "$APK" | grep "ic_erthi_seal"
          else
            echo "::error::ic_erthi_seal not found in APK resources."
            echo "::error::Ensure app/src/main/res/drawable/ic_erthi_seal.webp exists and"
            echo "::error::mipmap-anydpi-v26/ic_launcher.xml references @drawable/ic_erthi_seal."
            exit 1
          fi

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: erthi-amanah-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

      - name: Run Android lint
        run: ./gradlew lintDebug --no-daemon
        continue-on-error: true

      - name: Upload lint report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-results
          path: app/build/reports/lint-results-debug.html
          retention-days: 7

  release-prepare:
    name: Validate release readiness
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    needs: build
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build release APK (unsigned)
        run: ./gradlew assembleRelease --no-daemon
        env:
          SIGNING_ENABLED: false

      - name: Upload unsigned release APK
        uses: actions/upload-artifact@v4
        with:
          name: erthi-amanah-release-unsigned
          path: app/build/outputs/apk/release/app-release-unsigned.apk
          retention-days: 30
